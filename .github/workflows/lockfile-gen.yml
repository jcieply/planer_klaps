name: Lockfile (jednorazowo)
on:
  push:
    branches: [lockfile-gen]
permissions:
  contents: write
jobs:
  gen:
    if: "!contains(github.event.head_commit.message, '[lockfile]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: |
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -f package-lock.json web/package-lock.json
          git commit -m "Pliki package-lock.json [lockfile]"
          git push
