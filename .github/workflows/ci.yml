name: Testy
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund
        working-directory: web
      - name: Testy zapisu i profilu (Node)
        run: npm test
      - name: Typy i testy jednostkowe programu
        working-directory: web
        run: npx tsc -b && npx vitest run
      - name: Budowa aplikacji (app/)
        run: npm run prepare-app
      - name: Test prawdziwej aplikacji w Electronie
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a --server-args="-screen 0 1600x1000x24" npm run e2e
        env:
          KLAPS_SHOTS: ${{ runner.temp }}/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zrzuty-ekranu
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
  chmura:
    name: Chmura (SQL, supabase-js, Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: PostgreSQL
        run: ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql postgresql-contrib)
      - run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund
        working-directory: web
      - name: Schemat SQL (role, zaproszenia, RLS, numeracja zmian)
        run: bash supabase/tests/run.sh 2>&1 | tee chmura.log; test ${PIPESTATUS[0]} -eq 0
      - name: Stos chmury (supabase-js + Realtime + szyfrowanie na prawdziwym Postgresie)
        working-directory: web
        run: npm run test:cloud 2>&1 | tee ../chmura.log; test ${PIPESTATUS[0]} -eq 0
      - name: Aplikacja ze sztuczną chmurą wbudowaną w program
        run: npm run prepare-app
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54399
          VITE_SUPABASE_ANON_KEY: test-anon-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      - name: Dwie osoby w prawdziwej aplikacji (Electron)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a --server-args="-screen 0 1600x1000x24" npm run e2e:cloud 2>&1 | tee chmura.log; test ${PIPESTATUS[0]} -eq 0
        env:
          KLAPS_SHOTS: ${{ runner.temp }}/shots-chmura
      - name: Log błędu (jako adnotacja)
        if: failure()
        run: echo "::error::$(tail -c 3000 chmura.log | tr '\n' '|' | tr '%' ' ')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zrzuty-chmura
          path: ${{ runner.temp }}/shots-chmura
          if-no-files-found: ignore
