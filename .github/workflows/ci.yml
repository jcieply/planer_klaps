name: Testy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund
        working-directory: web
      - name: Testy zapisu i profilu (Node)
        run: npm test
      - name: Typy i testy jednostkowe programu
        working-directory: web
        run: npx tsc -b && npx vitest run
      - name: Budowa aplikacji (app/)
        run: npm run prepare-app
      - name: Test prawdziwej aplikacji w Electronie
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a --server-args="-screen 0 1600x1000x24" npm run e2e
        env:
          KLAPS_SHOTS: ${{ runner.temp }}/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zrzuty-ekranu
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
      - name: Zrzuty ekranu do gałęzi ci-shots (tylko podgląd na gałęzi desktop-2)
        if: always() && github.ref == 'refs/heads/desktop-2'
        run: |
          cd "${{ runner.temp }}/shots" 2>/dev/null || exit 0
          git init -q -b ci-shots && git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -q -m "zrzuty z uruchomienia ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-shots
