name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
# token workflowu może tylko czytać repozytorium (żaden krok nie zapisuje do niego)
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm test
      - name: Build
        run: npm run dist:win
        env:
          # adres chmury i klucz publiczny (anon) wbudowywane w program – użytkownik niczego nie wpisuje; patrz docs/CHMURA.md
          VITE_SUPABASE_URL: ${{ vars.KLAPS_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.KLAPS_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Klaps-Planer-Windows
          path: dist/*.exe
