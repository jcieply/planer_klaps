name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund
        working-directory: web
      - run: npm test
      - name: Build
        run: npm run dist:win
        env:
          # adres chmury i klucz publiczny (anon) wbudowywane w program – użytkownik niczego nie wpisuje; patrz docs/CHMURA.md
          VITE_SUPABASE_URL: ${{ vars.KLAPS_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.KLAPS_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: Klaps-Planer-Windows
          path: dist/*.exe
