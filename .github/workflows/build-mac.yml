name: Build macOS
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund
        working-directory: web
      - run: npm test
      - name: Build
        run: npm run dist:mac 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Show log on failure
        if: failure()
        run: echo "::error::$(tail -c 2500 build.log | tr '\n' '|' | tr '%' ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: Klaps-Planer-macOS
          path: dist/*.dmg
